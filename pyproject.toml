[project]
name = "budgetbakers-partner-sdk"
version = "0.1.1"
description = "BudgetBakers Partner API server SDK (AISP): typed client, webhook verification, hosted connect sessions."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
# The one runtime dependency (justified: sync HTTP client with timeouts and
# connection pooling; stdlib urllib has no sane retry/timeout ergonomics).
dependencies = ["httpx>=0.27,<1"]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "ruff==0.8.6",
    "mypy==1.14.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/budgetbakers_partner_sdk"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
