[project]
name = "budgetbakers-partner-sdk"
version = "0.2.0"
description = "BudgetBakers Partner API server SDK (AISP): typed client, webhook verification, hosted connect sessions."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "BudgetBakers", email = "integration@budgetbakers.com" }]
keywords = ["budgetbakers", "open-banking", "aisp", "psd2", "partner-api", "webhooks"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
# The one runtime dependency (justified: sync HTTP client with timeouts and
# connection pooling; stdlib urllib has no sane retry/timeout ergonomics).
dependencies = ["httpx>=0.27,<1"]

[project.urls]
Homepage = "https://aisp-docs.bbapi.io"
Documentation = "https://aisp-docs.bbapi.io"
Source = "https://github.com/BudgetBakers/partner-sdk-python"
Changelog = "https://github.com/BudgetBakers/partner-sdk-python/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "ruff==0.8.6",
    "mypy==1.14.1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/budgetbakers_partner_sdk"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
